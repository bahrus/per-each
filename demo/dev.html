<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
     <script type=module>
        import './CountryMedalCount.js';
        import './NationalMedalList.js';
        import '/emc.js';
     </script>
</head>
<body>

    <table itemscope=national-medal-list>
        <caption>Medal List Summer 2024</caption>
        <thead>
            <tr>
                <th></th>
                <th>Rank</th>
                <th>NOC</th>
                <th>Gold</th>
                <th>Silver</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <template per-each="country-medal-count of national-medal-list">
                <tr>
                    <td><plus-minus></plus-minus></td>
                    <td itemprop=rank></td>
                    <td itemprop=noc></td>
                    <td itemprop=gold></td>
                    <td itemprop=silver></td>
                    <td itemprop=bronze></td>
                    <td itemprop=total><span itemprop=total></span> of <span -o=totalMedalCount></span></td>
                </tr>
                <!-- <template 🎚️="on when isExpanded">
                    <tr>
                        <td colspan=4>
                            <medal-ment></medal-ment>
                        </td>
                    </tr>
                </template> -->

            </template>
        </tbody>
    </table>

    <script>
        const table = document.querySelector('table');
        if(table.ish === undefined) table.ish = {};
        table.ish.ishList = [
            {rank: 1, noc: 'United States', gold: 40, silver: 44, bronze: 42, total: 126},
            {rank: 2, noc: 'China', gold: 40, silver: 27, bronze: 24, total: 91},
            {rank: 3, noc: 'Japan', gold: 20, silver: 27, bronze: 13, total: 45},
        ];
    </script>
</body>
</html>
